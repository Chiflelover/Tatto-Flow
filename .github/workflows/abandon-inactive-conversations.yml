name: Abandon inactive conversations

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: abandon-inactive-conversations
  cancel-in-progress: false

jobs:
  abandon:
    if: github.repository == 'Chiflelover/Tatto-Flow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the protected production sweep
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ABANDONMENT_URL: https://tatto-flow-delta.vercel.app/api/conversations/abandon-inactive
        run: |
          if [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo "::error::Configure the repository CRON_SECRET with at least 32 characters."
            exit 1
          fi

          status=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output "${RUNNER_TEMP}/conversation-abandonment.json" \
            --write-out '%{http_code}' \
            "${ABANDONMENT_URL}")

          if [[ "$status" != "200" ]]; then
            echo "::error::The abandonment endpoint did not return HTTP 200."
            exit 1
          fi

          jq -e '.abandonedCount | numbers | select(. >= 0 and . == floor)' \
            "${RUNNER_TEMP}/conversation-abandonment.json"
